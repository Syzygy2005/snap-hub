<text x="687" y="140" font-size="32" fill="#F3F2E9" font-weight="400" letter-spacing="7">TRACK /</text>
<text x="687" y="187" font-size="32" fill="#F3F2E9" font-weight="400" letter-spacing="7">COMPETE</text>
<text x="687" y="225" font-size="12" fill="#A8D0B5" font-weight="400" letter-spacing="1.6">PLAY · COLLECT · IMPROVE · BELONG</text>
<text x="40" y="326" font-size="26" fill="#08664C" font-weight="700" >01 /</text><text x="114" y="326" font-size="26" fill="#102D29" font-weight="700" >LOGO SYSTEM</text><text x="114" y="355" font-size="17" fill="#52685C" font-weight="400" >A split card. A lightning cut. An open jade ring.</text>
<rect x="40" y="382" width="510" height="216" rx="14" fill="#F3F2E9" stroke="#102D29" stroke-opacity=".2"/>
<svg x="86" y="397" width="155" height="155" viewBox="0 0 200 200"><path d="M49 157A76 76 0 1 1 154 155" fill="none" stroke="#36D6A0" stroke-width="11" stroke-linecap="round"/><path d="M61 24H109.044444L67 110H94L59.166667 174.166667L46 161V39ZM141.75 24H145L160 39V161L145 176H90.85L126 100H99Z" fill="#102D29" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/><path d="M145 24L160 39V78H149V44L133 28Z" fill="#36D6A0" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/></svg><svg x="253" y="435" width="242" height="91.18840579710145" viewBox="0 0 276 104"><g transform="translate(11 2) skewX(-10)" fill="#102D29" fill-rule="evenodd"><path d="M14 0H63L54 14H23L18 19V22H42L55 35V45L42 58H0L9 44H34L39 39V36H15L2 23V13Z"/><path d="M68 58V0H83L112 32V0H128V58H113L84 26V58Z"/><path d="M132 58L155 0H178L201 58H183L179 47H151L147 58ZM156 34H174L165 12Z"/><path d="M207 58V0H247L264 17V31L247 46H224V58ZM224 14V32H241L247 26V20L241 14Z"/></g><g fill="#102D29" fill-rule="evenodd"><path d="M78 79H84V87H96V79H102V100H96V93H84V100H78Z"/><path d="M123 79H129V94H141V79H147V95L142 100H128L123 95Z"/><path d="M168 79H189L195 85V88L192 90L195 92V95L190 100H168ZM174 84V87H187L189 85.5L187 84ZM174 92V95H187L189 93.5L187 92Z"/></g><path d="M0 87H60V92H0ZM216 87H276V92H216Z" fill="#36D6A0"/></svg>
<text x="64" y="575" font-size="13" fill="#102D29" font-weight="700" letter-spacing="1.5">PRIMARY / CREAM</text>
<rect x="570" y="382" width="510" height="216" rx="14" fill="#102D29"/>
<svg x="616" y="397" width="155" height="155" viewBox="0 0 200 200"><path d="M49 157A76 76 0 1 1 154 155" fill="none" stroke="#36D6A0" stroke-width="11" stroke-linecap="round"/><path d="M61 24H109.044444L67 110H94L59.166667 174.166667L46 161V39ZM141.75 24H145L160 39V161L145 176H90.85L126 100H99Z" fill="#F3F2E9" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/><path d="M145 24L160 39V78H149V44L133 28Z" fill="#36D6A0" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/></svg><svg x="783" y="435" width="242" height="91.18840579710145" viewBox="0 0 276 104"><g transform="translate(11 2) skewX(-10)" fill="#F3F2E9" fill-rule="evenodd"><path d="M14 0H63L54 14H23L18 19V22H42L55 35V45L42 58H0L9 44H34L39 39V36H15L2 23V13Z"/><path d="M68 58V0H83L112 32V0H128V58H113L84 26V58Z"/><path d="M132 58L155 0H178L201 58H183L179 47H151L147 58ZM156 34H174L165 12Z"/><path d="M207 58V0H247L264 17V31L247 46H224V58ZM224 14V32H241L247 26V20L241 14Z"/></g><g fill="#F3F2E9" fill-rule="evenodd"><path d="M78 79H84V87H96V79H102V100H96V93H84V100H78Z"/><path d="M123 79H129V94H141V79H147V95L142 100H128L123 95Z"/><path d="M168 79H189L195 85V88L192 90L195 92V95L190 100H168ZM174 84V87H187L189 85.5L187 84ZM174 92V95H187L189 93.5L187 92Z"/></g><path d="M0 87H60V92H0ZM216 87H276V92H216Z" fill="#36D6A0"/></svg>
<text x="594" y="575" font-size="13" fill="#F3F2E9" font-weight="700" letter-spacing="1.5">REVERSE / FOREST</text>
<text x="40" y="630" font-size="18" fill="#102D29" font-weight="400" >Keep the custom lettering intact. Scale the complete emblem uniformly; preserve the ring opening.</text>
<text x="40" y="657" font-size="18" fill="#52685C" font-weight="400" >The lightning gap is transparent, so the actual surface shows through. Never fill it with a painted patch.</text>
<path d="M40 686H1080" stroke="#102D29" stroke-opacity=".18"/>
<text x="40" y="729" font-size="26" fill="#08664C" font-weight="700" >02 /</text><text x="114" y="729" font-size="26" fill="#102D29" font-weight="700" >COLOUR PALETTE</text><text x="114" y="758" font-size="17" fill="#52685C" font-weight="400" >Cream leads. Forest gives contrast. Jade draws attention.</text>
<rect x="40" y="785" width="192" height="76" rx="8" fill="#F3F2E9" stroke="#102D29" stroke-opacity=".2"/><text x="40" y="890" font-size="15" fill="#102D29" font-weight="700" >CREAM</text><text x="40" y="914" font-size="16" fill="#102D29" font-weight="400" >#F3F2E9</text><text x="40" y="938" font-size="14" fill="#52685C" font-weight="400" >Primary light surface</text><rect x="252" y="785" width="192" height="76" rx="8" fill="#36D6A0" stroke="#102D29" stroke-opacity=".2"/><text x="252" y="890" font-size="15" fill="#102D29" font-weight="700" >JADE</text><text x="252" y="914" font-size="16" fill="#102D29" font-weight="400" >#36D6A0</text><text x="252" y="938" font-size="14" fill="#52685C" font-weight="400" >Ring, accents, actions</text><rect x="464" y="785" width="192" height="76" rx="8" fill="#102D29" stroke="#102D29" stroke-opacity=".2"/><text x="464" y="890" font-size="15" fill="#102D29" font-weight="700" >FOREST</text><text x="464" y="914" font-size="16" fill="#102D29" font-weight="400" >#102D29</text><text x="464" y="938" font-size="14" fill="#52685C" font-weight="400" >Ink and dark canvas</text><rect x="676" y="785" width="192" height="76" rx="8" fill="#19413A" stroke="#102D29" stroke-opacity=".2"/><text x="676" y="890" font-size="15" fill="#102D29" font-weight="700" >SURFACE</text><text x="676" y="914" font-size="16" fill="#102D29" font-weight="400" >#19413A</text><text x="676" y="938" font-size="14" fill="#52685C" font-weight="400" >Dark-theme panels</text><rect x="888" y="785" width="192" height="76" rx="8" fill="#A8D0B5" stroke="#102D29" stroke-opacity=".2"/><text x="888" y="890" font-size="15" fill="#102D29" font-weight="700" >MUTED</text><text x="888" y="914" font-size="16" fill="#102D29" font-weight="400" >#A8D0B5</text><text x="888" y="938" font-size="14" fill="#52685C" font-weight="400" >Dark-theme support</text>
<path d="M40 962H1080" stroke="#102D29" stroke-opacity=".18"/>
<text x="40" y="1005" font-size="26" fill="#08664C" font-weight="700" >03 /</text><text x="114" y="1005" font-size="26" fill="#102D29" font-weight="700" >TYPOGRAPHY</text><text x="114" y="1034" font-size="17" fill="#52685C" font-weight="400" >Manrope for headings. Inter for reading. Custom outlines for the logo.</text>
<text x="40" y="1076" font-size="13" fill="#52685C" font-weight="700" letter-spacing="1.4">HEADINGS / MANROPE BOLD</text>
<text x="40" y="1125" font-size="43" fill="#102D29" font-weight="800" font-family="Manrope, Arial, sans-serif" letter-spacing="-1.5">Build your next</text>
<text x="40" y="1173" font-size="43" fill="#102D29" font-weight="800" font-family="Manrope, Arial, sans-serif" letter-spacing="-1.5">winning deck.</text>
<path d="M555 1060V1183" stroke="#102D29" stroke-opacity=".18"/>
<text x="594" y="1076" font-size="13" fill="#52685C" font-weight="700" letter-spacing="1.4">BODY / INTER REGULAR</text>
<text x="594" y="1116" font-size="24" fill="#102D29" font-weight="400" >Explore decks, track your progress,</text>
<text x="594" y="1150" font-size="24" fill="#102D29" font-weight="400" >and find your community.</text>
<text x="594" y="1180" font-size="17" fill="#52685C" font-weight="400" >Use tabular numerals for scores and statistics.</text>
<path d="M40 1210H1080" stroke="#102D29" stroke-opacity=".18"/>
<text x="40" y="1253" font-size="26" fill="#08664C" font-weight="700" >04 /</text><text x="114" y="1253" font-size="26" fill="#102D29" font-weight="700" >SPACE &amp; SCALE</text><text x="114" y="1282" font-size="17" fill="#52685C" font-weight="400" >Keep breathing room. Use the emblem alone when space is limited.</text>
<svg x="40" y="1335" width="24" height="24" viewBox="0 0 200 200"><path d="M49 157A76 76 0 1 1 154 155" fill="none" stroke="#36D6A0" stroke-width="11" stroke-linecap="round"/><path d="M61 24H109.044444L67 110H94L59.166667 174.166667L46 161V39ZM141.75 24H145L160 39V161L145 176H90.85L126 100H99Z" fill="#102D29" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/><path d="M145 24L160 39V78H149V44L133 28Z" fill="#36D6A0" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/></svg><text x="40" y="1400" font-size="13" fill="#52685C" font-weight="700" >24 PX</text>
<svg x="121" y="1315" width="44" height="44" viewBox="0 0 200 200"><path d="M49 157A76 76 0 1 1 154 155" fill="none" stroke="#36D6A0" stroke-width="11" stroke-linecap="round"/><path d="M61 24H109.044444L67 110H94L59.166667 174.166667L46 161V39ZM141.75 24H145L160 39V161L145 176H90.85L126 100H99Z" fill="#102D29" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/><path d="M145 24L160 39V78H149V44L133 28Z" fill="#36D6A0" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/></svg><svg x="171" y="1317.4" width="104" height="39.18840579710145" viewBox="0 0 276 104"><g transform="translate(11 2) skewX(-10)" fill="#102D29" fill-rule="evenodd"><path d="M14 0H63L54 14H23L18 19V22H42L55 35V45L42 58H0L9 44H34L39 39V36H15L2 23V13Z"/><path d="M68 58V0H83L112 32V0H128V58H113L84 26V58Z"/><path d="M132 58L155 0H178L201 58H183L179 47H151L147 58ZM156 34H174L165 12Z"/><path d="M207 58V0H247L264 17V31L247 46H224V58ZM224 14V32H241L247 26V20L241 14Z"/></g><g fill="#102D29" fill-rule="evenodd"><path d="M78 79H84V87H96V79H102V100H96V93H84V100H78Z"/><path d="M123 79H129V94H141V79H147V95L142 100H128L123 95Z"/><path d="M168 79H189L195 85V88L192 90L195 92V95L190 100H168ZM174 84V87H187L189 85.5L187 84ZM174 92V95H187L189 93.5L187 92Z"/></g><path d="M0 87H60V92H0ZM216 87H276V92H216Z" fill="#36D6A0"/></svg><text x="121" y="1400" font-size="13" fill="#52685C" font-weight="700" >HEADER / 44 PX</text>
<rect x="323" y="1301" width="94" height="94" rx="20" fill="#F3F2E9" stroke="#102D29" stroke-opacity=".2"/>
<svg x="332" y="1310" width="76" height="76" viewBox="0 0 200 200"><path d="M49 157A76 76 0 1 1 154 155" fill="none" stroke="#36D6A0" stroke-width="11" stroke-linecap="round"/><path d="M61 24H109.044444L67 110H94L59.166667 174.166667L46 161V39ZM141.75 24H145L160 39V161L145 176H90.85L126 100H99Z" fill="#102D29" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/><path d="M145 24L160 39V78H149V44L133 28Z" fill="#36D6A0" transform="translate(100 100) scale(.70) translate(-103 -100) rotate(12 103 100)"/></svg><text x="323" y="1422" font-size="13" fill="#52685C" font-weight="700" >APP / SOCIAL</text>
<text x="488" y="1330" font-size="18" fill="#102D29" font-weight="400" >Retain the viewBox padding and keep controls outside the ring.</text>
<text x="488" y="1362" font-size="18" fill="#102D29" font-weight="400" >Use forest artwork on light surfaces and cream artwork on dark.</text>
<text x="488" y="1394" font-size="18" fill="#102D29" font-weight="400" >Do not stretch, close the ring, rotate again or retype the wordmark.</text>
<path d="M40 1450H1080" stroke="#102D29" stroke-opacity=".18"/>
<text x="40" y="1494" font-size="22" fill="#102D29" font-weight="700" >Clear over complicated.</text>
<text x="399" y="1494" font-size="22" fill="#102D29" font-weight="700" >Confident, never loud.</text>
<text x="758" y="1494" font-size="22" fill="#102D29" font-weight="700" >Built around community.</text>
<text x="40" y="1537" font-size="11" fill="#52685C" font-weight="400" letter-spacing="1.8">SNAP HUB / JADE LEAGUE / VISUAL BRAND GUIDE</text>
<text x="878" y="1537" font-size="11" fill="#52685C" font-weight="400" letter-spacing="1.3">UPDATED 2026-09-24</text>
</g></svg>
